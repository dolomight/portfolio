[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/framework/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Password gate for the whole site (see netlify/edge-functions/password.ts)
[[edge_functions]]
  path = "/*"
  function = "password"
